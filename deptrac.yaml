deptrac:
  paths:
    - src
  layers:
    - name: Command
      collectors:
        - type: directory
          value: src/Command/
    - name: Service
      collectors:
        - type: directory
          value: src/Service/
    - name: Dto
      collectors:
        - type: directory
          value: src/Dto/
    - name: Bootstrap
      collectors:
        - type: directory
          value: src/Bootstrap/
    - name: NativeHost
      collectors:
        - type: directory
          value: src/NativeHost/
  ruleset:
    Command:
      - Service
      - Dto
      - Bootstrap
    Service:
      - Dto
      - Bootstrap
    NativeHost:
      - Dto
      - Bootstrap
      - Service
    Bootstrap:
      - Dto
    Dto: ~
