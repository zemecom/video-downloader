<section class="overlay" hidden>
  <div class="header">
    <div class="title">YTD: загрузка</div>
    <button class="close" type="button" aria-label="Закрыть">×</button>
  </div>
  <div class="status">Подготавливаю загрузку...</div>
  <div class="progress-shell">
    <div class="progress-fill" data-indeterminate="true"></div>
  </div>
  <div class="meta">
    <span class="phase">Ожидание</span>
    <span class="percent">--</span>
  </div>
  <div class="actions">
    <button
      class="button button-danger error-action"
      type="button"
      hidden
    >
      Посмотреть ошибку
    </button>
    <button class="button button-secondary close-action" type="button">
      Скрыть
    </button>
    <button class="button button-primary cancel-action" type="button">
      Отменить
    </button>
    <button
      class="button button-secondary finder-action"
      type="button"
      hidden
    >
      Finder
    </button>
    <button
      class="button button-primary play-action"
      type="button"
      hidden
    >
      Воспроизвести
    </button>
    <button
      class="button button-primary open-action"
      type="button"
      hidden
    >
      Открыть
    </button>
  </div>
  <div class="error-panel" hidden>
    <div class="error-panel-header">
      <span class="error-panel-title">Детали ошибки</span>
      <button class="error-panel-close" type="button" aria-label="Закрыть">✕</button>
    </div>
    <pre class="error-panel-text"></pre>
    <div class="error-panel-footer">
      <button class="button button-secondary error-panel-copy" type="button">Скопировать</button>
    </div>
  </div>
</section>
